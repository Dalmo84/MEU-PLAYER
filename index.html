<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Player</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1c1c1a;--mu:#76766f;--ac:#3b6cf6;--bd:#e2e2dc}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#201f1d;--tx:#eee;--mu:#9a9a92;--ac:#7a9bff;--bd:#33322f}}
*{box-sizing:border-box}
body{margin:0 auto;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:14px;max-width:720px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin-bottom:8px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.on{background:var(--ac);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
#stage video,#stage img{width:100%;max-height:55vh;border-radius:8px;background:#000;object-fit:contain}
#stage audio{width:100%}
#now{font-weight:600;margin:0 0 8px}
.item{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border:0}.item.cur{color:var(--ac)}
.item b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tag{font-size:12px;color:var(--mu)}
.x{background:none;color:var(--mu);width:auto;margin:0;padding:4px 8px;font-size:18px;border:0}
.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tabs button{margin:0;padding:8px;width:auto;flex:1;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}.chk input{width:auto;margin:0}
</style>
</head>
<body>
<h1>🎬 Meu Player</h1>

<div class="card" id="playerCard" hidden>
  <p id="now"></p>
  <div id="stage"></div>
  <div class="row" style="margin-top:10px">
    <button class="sec" id="prev">⏮ Anterior</button>
    <button class="sec" id="next">Próximo ⏭</button>
  </div>
  <div class="row">
    <button class="sec" id="shuf">🔀 Aleatório</button>
    <button class="sec" id="rep">🔁 Repetir</button>
    <select id="speed" title="Velocidade">
      <option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option>
    </select>
  </div>
  <div class="row">
    <button id="cast">📺 TV</button>
    <button id="fav" class="sec">☆ Favoritar</button>
  </div>
  <div class="row">
    <button id="dl">⬇ Baixar</button>
    <button class="sec" id="open">↗ Abrir link</button>
  </div>
  <button class="sec" id="mp3b">🎵 Mover para MP3</button>
  <button class="sec" id="mv">🔒 Mover para o cofre</button>
  <p class="mu" id="msg"></p>
</div>

<div class="card">
  <input id="title" placeholder="Título (opcional)">
  <input id="url" placeholder="Cole o link (mp4, mp3, jpg, png...)" inputmode="url">
  <label class="chk"><input type="checkbox" id="toMp3"> Salvar na pasta 🎵 MP3</label>
  <label class="chk" id="vaultChk" hidden><input type="checkbox" id="toVault"> Adicionar ao cofre 🔒</label>
  <div class="row">
    <select id="type">
      <option value="auto">Tipo: automático</option>
      <option value="video">Vídeo</option>
      <option value="audio">Áudio</option>
      <option value="image">Imagem</option>
    </select>
    <button id="add">Adicionar e tocar</button>
  </div>
</div>

<div class="card">
  <div class="tabs">
    <button id="tAll" class="on">Todos</button>
    <button id="tFav" class="sec">⭐ Favoritos</button>
    <button id="tMp3" class="sec">🎵 MP3</button>
    <button id="tVault" class="sec">🔒 Cofre</button>
    <button id="tPlay" class="sec">▶ Tocar tudo</button>
  </div>
  <div id="vaultBox" hidden>
    <input id="pw" type="password" placeholder="Senha do cofre" autocomplete="off">
    <div class="row"><button id="unlock">Abrir cofre</button><button class="sec" id="lockBtn" hidden>Bloquear agora</button></div>
    <p class="mu" id="vmsg"></p>
  </div>
  <div id="list"></div>
</div>
<p class="mu">Use links diretos para o arquivo. YouTube e similares não funcionam. Imagens avançam sozinhas a cada 5 s na playlist.</p>

<script>
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let items=ld('mp_items',[]),vault=null,vkey=null,vsalt=null;
let cur=-1,playSrc='main',view='all',shuffle=ld('mp_shuf',false),repeat=ld('mp_rep',true),speed=ld('mp_speed','1'),timer=null,el=null;
const icon={video:'🎞️',audio:'🎵',image:'🖼️'};
const arrOf=s=>s==='vault'?(vault||[]):items;
const viewSrc=()=>view==='vault'?'vault':'main';
const curItem=()=>arrOf(playSrc)[cur];

// ---- Cofre (criptografia AES-GCM, chave derivada da senha) ----
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derive(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function saveVault(){
  if(!vkey)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},vkey,new TextEncoder().encode(JSON.stringify(vault)));
  sv('mp_vault',{s:b64(vsalt),i:b64(iv),d:b64(ct)});
}
async function unlock(){
  const pw=$('pw').value,m=$('vmsg');
  if(!crypto.subtle){m.textContent='Cofre exige conexão segura (https).';return}
  const rec=ld('mp_vault',null);
  try{
    if(!rec){
      if(pw.length<4){m.textContent='Escolha uma senha com pelo menos 4 caracteres.';return}
      vsalt=crypto.getRandomValues(new Uint8Array(16));vkey=await derive(pw,vsalt);vault=[];await saveVault();
    }else{
      vsalt=unb64(rec.s);const k=await derive(pw,vsalt);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.i)},k,unb64(rec.d));
      vkey=k;vault=JSON.parse(new TextDecoder().decode(pt));
    }
    $('pw').value='';m.textContent='';vaultUI();render();
  }catch(e){m.textContent='Senha incorreta.'}
}
function stop(){clearTimeout(timer);$('stage').innerHTML='';$('playerCard').hidden=true;cur=-1;el=null}
function lock(){
  if(playSrc==='vault')stop();
  vault=null;vkey=null;vaultUI();render();
}
function vaultUI(){
  const open=!!vault,has=!!ld('mp_vault',null);
  $('vaultBox').hidden=view!=='vault';
  $('pw').hidden=open;$('unlock').hidden=open;$('lockBtn').hidden=!open;
  $('unlock').textContent=has?'Abrir cofre':'Criar cofre';
  if(view==='vault'&&!open&&!$('vmsg').textContent)$('vmsg').textContent=has?'':'Primeira vez: a senha que você digitar agora será a senha do cofre. Se esquecer, não há como recuperar.';
  $('vaultChk').hidden=!open;
  if(!open)$('toVault').checked=false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&vault)lock()});

// ---- Player ----
function detect(u){
  const p=u.split('?')[0].toLowerCase();
  if(/\.(mp4|webm|mkv|mov|m4v|ogv|m3u8)$/.test(p))return'video';
  if(/\.(mp3|m4a|aac|wav|ogg|oga|flac|opus)$/.test(p))return'audio';
  if(/\.(jpe?g|png|gif|webp|svg|bmp|avif)$/.test(p))return'image';
  return'video';
}
function fname(it){
  const last=decodeURIComponent(it.url.split('?')[0].split('/').pop()||'');
  return last||it.title.replace(/[^\w\-]+/g,'_');
}
const persist=s=>s==='vault'?saveVault():sv('mp_items',items);
const inView=(it,s)=>s!=='main'?true:view==='fav'?!!it.fav:view==='mp3'?it.folder==='mp3':true;
function visible(){return arrOf(viewSrc()).map((it,i)=>({it,i})).filter(o=>inView(o.it,viewSrc()))}
function render(){
  const l=$('list');l.innerHTML='';
  if(view==='vault'&&!vault){l.innerHTML='<p class="mu">🔒 Cofre bloqueado.</p>';return}
  const v=visible();
  if(!v.length){l.innerHTML='<p class="mu">Nada por aqui ainda.</p>';return}
  v.forEach(({it,i})=>{
    const d=document.createElement('div');d.className='item'+(i===cur&&playSrc===viewSrc()?' cur':'');
    d.innerHTML=`<span>${icon[it.type]}</span><b></b><span>${it.fav?'⭐':''}</span><button class="x" title="Remover">×</button>`;
    d.querySelector('b').textContent=it.title;
    d.onclick=()=>play(i);
    d.querySelector('.x').onclick=e=>{
      e.stopPropagation();const s=viewSrc();
      if(playSrc===s){if(cur===i)stop();else if(cur>i)cur--}
      arrOf(s).splice(i,1);persist(s);render();
    };
    l.appendChild(d);
  });
}
function play(i,s){
  s=s||viewSrc();const arr=arrOf(s);
  if(i<0||i>=arr.length)return;
  clearTimeout(timer);playSrc=s;cur=i;const it=arr[i];
  $('playerCard').hidden=false;$('now').textContent=it.title;$('msg').textContent='';
  $('mv').textContent=s==='vault'?'🔓 Tirar do cofre':'🔒 Mover para o cofre';
  $('mp3b').hidden=s==='vault';$('mp3b').textContent=it.folder==='mp3'?'🎵 Tirar do MP3':'🎵 Mover para MP3';
  const st=$('stage');st.innerHTML='';
  el=document.createElement(it.type==='image'?'img':it.type);
  el.src=it.url;
  if(it.type==='image'){timer=setTimeout(next,5000)}
  else{el.controls=true;el.autoplay=true;el.preload='auto';el.playsInline=true;el.playbackRate=+speed;el.onended=next}
  el.onerror=()=>{$('msg').textContent='Não foi possível carregar este item. Pulando em 3 s...';timer=setTimeout(next,3000)};
  st.appendChild(el);
  $('fav').textContent=it.fav?'⭐ Favorito':'☆ Favoritar';
  render();scrollTo({top:0,behavior:'smooth'});
}
function pool(){
  const arr=arrOf(playSrc);
  const p=arr.map((it,i)=>i).filter(i=>inView(arr[i],playSrc));
  return p.length?p:arr.map((_,i)=>i);
}
function next(){
  const p=pool();if(!p.length)return;
  if(shuffle){play(p[Math.floor(Math.random()*p.length)],playSrc);return}
  const k=p.indexOf(cur);
  if(k>=0&&k<p.length-1)play(p[k+1],playSrc);
  else if(repeat)play(p[0],playSrc);
}
function prev(){const p=pool(),k=p.indexOf(cur);play(k>0?p[k-1]:p[p.length-1],playSrc)}
function sync(){$('shuf').className=shuffle?'on':'sec';$('rep').className=repeat?'on':'sec';$('speed').value=speed}
$('shuf').onclick=()=>{shuffle=!shuffle;sv('mp_shuf',shuffle);sync()};
$('rep').onclick=()=>{repeat=!repeat;sv('mp_rep',repeat);sync()};
$('speed').onchange=e=>{speed=e.target.value;sv('mp_speed',speed);if(el&&el.playbackRate!==undefined)el.playbackRate=+speed};
$('next').onclick=next;$('prev').onclick=prev;
$('fav').onclick=()=>{const it=curItem();if(!it)return;it.fav=!it.fav;persist(playSrc);$('fav').textContent=it.fav?'⭐ Favorito':'☆ Favoritar';render()};
function setView(v){
  view=v;
  $('tAll').className=v==='all'?'on':'sec';$('tFav').className=v==='fav'?'on':'sec';$('tVault').className=v==='vault'?'on':'sec';$('tMp3').className=v==='mp3'?'on':'sec';
  $('toMp3').checked=v==='mp3';
  vaultUI();render();
}
$('tAll').onclick=()=>setView('all');
$('tFav').onclick=()=>setView('fav');
$('tVault').onclick=()=>setView('vault');
$('tMp3').onclick=()=>setView('mp3');
$('mp3b').onclick=()=>{
  const it=curItem();if(!it||playSrc==='vault')return;
  it.folder=it.folder==='mp3'?'':'mp3';persist('main');
  $('mp3b').textContent=it.folder==='mp3'?'🎵 Tirar do MP3':'🎵 Mover para MP3';render();
};
$('unlock').onclick=unlock;
$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};
$('lockBtn').onclick=()=>{lock();$('vmsg').textContent='Cofre bloqueado.'};
$('tPlay').onclick=()=>{
  const s=viewSrc();if(s==='vault'&&!vault)return;
  const arr=arrOf(s),p=arr.map((_,i)=>i).filter(i=>inView(arr[i],s));
  if(p.length)play(shuffle?p[Math.floor(Math.random()*p.length)]:p[0],s);
};
$('mv').onclick=async()=>{
  const it=curItem();if(!it)return;
  if(!vault){$('msg').textContent='Abra o cofre primeiro (aba 🔒 Cofre) para mover itens.';return}
  const from=playSrc,to=from==='vault'?'main':'vault';
  arrOf(from).splice(cur,1);arrOf(to).unshift(it);
  persist('main');await saveVault();stop();render();
};
$('add').onclick=async()=>{
  const url=$('url').value.trim();if(!url)return;
  let type=$('type').value;if(type==='auto')type=detect(url);
  const title=$('title').value.trim()||decodeURIComponent(url.split('?')[0].split('/').pop())||'Sem título';
  const to=(vault&&$('toVault').checked)?'vault':'main';
  arrOf(to).unshift({title,url,type,fav:false,folder:(to==='main'&&$('toMp3').checked)?'mp3':''});persist(to);
  $('title').value='';$('url').value='';play(0,to);
};
$('open').onclick=()=>{const it=curItem();if(it)window.open(it.url,'_blank')};

// TV: Chromecast (Remote Playback API) e AirPlay (Safari)
$('cast').onclick=async()=>{
  const m=$('msg'),it=curItem();
  if(!el||!it){m.textContent='Toque em um item primeiro.';return}
  if(it.type==='image'){m.textContent='Imagens não podem ser transmitidas direto. Use "Transmitir tela" do celular ou do navegador.';return}
  el.disableRemotePlayback=false;
  try{
    if(el.remote){await el.remote.prompt();m.textContent='Transmitindo para a TV...'}
    else if(el.webkitShowPlaybackTargetPicker){el.webkitShowPlaybackTargetPicker()}
    else m.textContent='Este navegador não suporta transmissão direta. Use o Chrome (Chromecast) ou Safari (AirPlay), ou o menu do navegador > Transmitir.';
  }catch(e){
    m.textContent=e&&e.name==='NotFoundError'?'Nenhuma TV encontrada. Confirme que ela está na mesma rede Wi-Fi.':'Não foi possível transmitir. Tente o menu do navegador > Transmitir.';
  }
};

$('dl').onclick=async()=>{
  const it=curItem();if(!it)return;
  $('msg').textContent='Baixando...';
  try{
    const r=await fetch(it.url);if(!r.ok)throw 0;
    const b=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname(it);
    document.body.appendChild(a);a.click();a.remove();
    $('msg').textContent='Download iniciado ✔';
  }catch(e){
    const a=document.createElement('a');a.href=it.url;a.download=fname(it);a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    $('msg').textContent='O servidor bloqueou o download direto. O arquivo abriu em outra aba: use "Salvar como" ou segure o dedo sobre ele.';
  }
};
sync();vaultUI();render();
</script>
</body>
</html>
